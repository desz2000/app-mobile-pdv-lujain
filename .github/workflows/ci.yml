name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install maui-android workload
        run: dotnet workload install maui-android --no-cache

      - name: Restore
        run: dotnet restore PdvBalanca.sln

      - name: Build (Debug)
        run: dotnet build PdvBalanca.sln -c Debug -f net8.0-android --no-restore

      - name: Publish APK (Release)
        run: dotnet publish src/PdvBalanca/PdvBalanca.csproj -c Release -f net8.0-android -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdvBalanca-apk
          path: src/PdvBalanca/bin/Release/net8.0-android/publish/*-Signed.apk
          if-no-files-found: warn
